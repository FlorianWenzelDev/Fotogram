<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="shortcut icon" href="./assets/icons/Favicon.svg" type="image/x-icon">
    <title>Fotogram</title>
    <link rel="stylesheet" href="./css/fonts.css">
    <link rel="stylesheet" href="./css/variables.css">
    <link rel="stylesheet" href="./css/styles.css">

</head>

<body onload="loadAlbum()">
    <header class="siteheader">
        <img class="company-logo" src="./assets/icons/Company_logo.svg" alt="Companylogo">
    </header>
    <main>
        <h1>Your personal photo album</h1>
        <section id="albumWrapper" class="album-wrapper">
        </section>
        <dialog aria-label="Picture viewer" closedby="any" id="pictureViewer" class="picture-viewer">
            <div class="dialog-header-styling-container">
                <h2 tabindex="1" id="pictureTitle">Placeholder</h2>
                <button aria-label="close dialog" class="close-button" onclick="closeDialog()"><img src="./assets/icons/close.svg"
                        alt="Closebutton"></button>
            </div>
            <div class="img-wrapper">
                <img aria-labelledby="pictureTitle" id="singlePictureView" src="./assets/img/lake-2896379_1280.jpg " alt="Placeholder">
            </div>
            <nav class="picture-viewer-navigation">
                <button aria-label="show next picture" onclick="updateDialogElements(event, -1)" class="nav-button"><img src="./assets/icons/Arrow_left.svg"
                        alt="Left arrow"></button>
                <p id="currentPictureIndicator">1 / 12</p>
                <button aria-label="show before picture" onclick="updateDialogElements(event, +1)" class="nav-button"><img
                        src="./assets/icons/Arrow_right.svg" alt="Right arrow"></button>
            </nav>
        </dialog>
    </main>
    <footer class="sitefooter">
        <img src="./assets/icons/DA_logo.svg" alt="DA logo">
        <p>© 2023 Developer Akademie GmbH</p>
    </footer>
</body>
<script src="script.js"></script>

</html>
